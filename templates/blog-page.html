{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ page.title }}
</h1>
<div class="subtitle">
  <div class="bar">
    <p><strong>{{ page.date | date(format="%d %b %Y") }}</strong></p>

    <button id="theme-toggle" aria-label="Toggle theme">
      <i data-lucide="sun" class="icon sun"></i>
      <i data-lucide="moon" class="icon moon"></i>
    </button>
  </div>
<hr />
</div>
{{ page.content | safe }}
{% endblock content %}
