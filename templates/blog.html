{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ section.title }}
</h1>
<ul>
  {% for page in section.pages %}
  <li class="blog-entry">
    <div class="blog-entry-row">
      <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
      <span>{{ page.date | date(format="%d %b %Y") }}</span>
    </div>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
